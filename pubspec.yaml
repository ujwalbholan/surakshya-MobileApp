name: suraksha
description: The Guardian On Your Wrist — Women's Safety IoT Wearable App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  google_fonts: ^6.2.1

  geolocator: ^12.0.0
  geocoding: ^3.0.0

  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2

  http: ^1.2.2
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  intl: ^0.19.0
  uuid: ^4.4.2
  collection: ^1.18.0

  visibility_detector: ^0.4.0+2
  marquee: ^2.2.3
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  flutter_svg: ^2.0.10+1

  flutter_blue_plus: ^1.32.12
  battery_plus: ^6.0.3
  flutter_local_notifications: ^17.2.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/avatars/
    - assets/images/reference/
    - assets/models/wristband.glb
